[project]
name = "py-symphony"
version = "0.1.0"
description = "Symphony Service - orchestrate coding agents"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "structlog>=24.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
symphony = "runtime.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "symphony*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "Q"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
