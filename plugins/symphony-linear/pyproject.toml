[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-linear"
version = "1.0.0"
description = "Linear tracker adapter plugin for Symphony"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Symphony Team", email = "team@symphony.dev"}
]
keywords = ["symphony", "tracker", "linear", "adapter", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28.0",
    "symphony>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/symphony-dev/symphony-linear"
Documentation = "https://docs.symphony.dev/trackers/linear"
Repository = "https://github.com/symphony-dev/symphony-linear"
Issues = "https://github.com/symphony-dev/symphony-linear/issues"

[project.entry-points."symphony.trackers"]
linear = "symphony_linear.adapter:LinearAdapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony_linear*"]

[tool.setuptools.package-data]
symphony_linear = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio-mode = "auto"