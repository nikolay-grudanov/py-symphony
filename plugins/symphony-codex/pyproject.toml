[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-codex"
version = "1.0.0"
description = "Codex agent backend plugin for Symphony"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Symphony Team", email = "team@symphony.dev"}
]
keywords = ["symphony", "agent", "codex", "backend", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "symphony>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/symphony-dev/symphony-codex"
Documentation = "https://docs.symphony.dev/agents/codex"
Repository = "https://github.com/symphony-dev/symphony-codex"
Issues = "https://github.com/symphony-dev/symphony-codex/issues"

[project.entry-points."symphony.agent_backends"]
codex = "symphony_codex.backend:CodexBackend"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony_codex*"]

[tool.setuptools.package-data]
symphony_codex = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio-mode = "auto"
