[project]
name = 'symphony-yandex-tracker'
version = '0.1.0'
description = 'Yandex Tracker adapter plugin for Symphony orchestration platform'
readme = 'README.md'
requires-python = '>=3.11'
keywords = ['symphony', 'tracker', 'yandex', 'adapter', 'plugin']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]

dependencies = [
    'httpx>=0.27.0',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0.0',
    'pytest-asyncio>=0.23.0',
    'pytest-cov>=4.1.0',
    'ruff>=0.4.0',
    'mypy>=1.10.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
python_files = ['test_*.py']
python_classes = ['Test*']
python_functions = ['test_*']
asyncio_mode = 'auto'
addopts = '-ra -q --strict-markers'

[tool.ruff]
target-version = 'py311'
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP', 'B', 'C4', 'ANN']
ignore = ['ANN101', 'ANN102', 'ANN201', 'ANN401', 'N815', 'B904', 'UP017']

[tool.ruff.format]
quote-style = 'double'
indent-style = 'space'
line-ending = 'auto'

[tool.mypy]
python_version = '3.11'
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = 'tests.*'
disallow_untyped_defs = false

[project.entry-points.'symphony.trackers']
yandex_tracker = 'symphony_yandex_tracker.adapter:YandexTrackerAdapter'