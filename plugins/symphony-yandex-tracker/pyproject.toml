[project]
name = 'symphony-yandex-tracker'
version = '0.1.0'
description = 'Yandex Tracker adapter plugin for Symphony orchestration platform'
readme = 'README.md'
requires-python = '>=3.11'
keywords = ['symphony', 'tracker', 'yandex', 'adapter', 'plugin']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]

dependencies = [
    'httpx>=0.27.0',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0.0',
    'pytest-asyncio>=0.23.0',
    'pytest-cov>=4.1.0',
    'ruff>=0.4.0',
    'mypy>=1.10.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
python_files = ['test_*.py']
python_classes = ['Test*']
python_functions = ['test_*']
asyncio_mode = 'auto'
addopts = '-ra -q --strict-markers'

[tool.ruff]
target-version = 'py311'
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP', 'B', 'C4', 'ANN']
# ANN001 (missing arg type) and ANN202 (missing return type) are allowed in tests
# because the [[tool.mypy.overrides]] for tests.* is ignored when mypy --strict is set
# at the project level. Allowing these in ruff keeps style consistent with mypy.
# ANN101/ANN102 are obsolete in modern ruff (implicit self/cls typing); ignore is a no-op.
ignore = ['ANN201', 'ANN401', 'ANN001', 'ANN202', 'N815', 'B904', 'UP017']

[tool.ruff.format]
quote-style = 'double'
indent-style = 'space'
line-ending = 'auto'

[tool.mypy]
python_version = '3.11'
warn_return_any = true
warn_unused_ignores = true
# Strict mode is set per-target below (plugin source = strict, tests = relaxed).
# Reason: mypy 1.20+ does NOT honour per-file `disallow_untyped_defs = false`
# overrides when project-level `strict = true` is set. Setting strict here
# would force type annotations on every test helper, which is what the original
# t_04283525 / t_61f66531 block found to be impractical. Production code is
# still fully strict; tests get `no-untyped-def` disabled.
strict = false
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_explicit_any = true
warn_redundant_casts = true
warn_unused_configs = true
extra_checks = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = 'symphony_yandex_tracker.*'
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_explicit_any = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = 'tests.*'
disallow_untyped_defs = false
disable_error_code = ['no-untyped-def', 'no-untyped-call']

[project.entry-points.'symphony.trackers']
yandex_tracker = 'symphony_yandex_tracker.adapter:YandexTrackerAdapter'